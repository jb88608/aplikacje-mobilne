<!DOCTYPE html>
<html lang="pl">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#000000" />
        <title>Powiadomienia</title>
        <link rel="manifest" href="manifest.json" />
        <script src="notification.js" defer></script>
    </head>
    <body>
        <h1>Notification API</h1>
        <p>Uprawnienie do powiadomień: <strong id="permission">?</strong></p>
        <button id="enable">Włącz powiadomienia</button>
        <button id="local">Powiadomienie ze strony</button>
        <button id="sw">Powiadomienie z service workera</button>

        <h2>Web Push</h2>
        <button id="subscribe">Subskrybuj powiadomienia push</button>
        <button id="unsubscribe">Anuluj subskrypcję</button>
        <p>
            <label for="subscription">Subskrypcja (skopiuj do pliku lab_02/subscription.json):
            </label><br />
            <textarea id="subscription" rows="10" cols="60" readonly></textarea>
        </p>
        <button id="copy">Kopiuj subskrypcję</button>

        
        <h2>Własne powiadomienie</h2>

        <form id="notification-form">
            <label for="title">Tytuł:</label><br />
            <input id="title" name="title" type="text" required /><br /><br />

            <label for="body">Treść:</label><br />
            <textarea id="body" name="body" rows="4"></textarea><br /><br />

            <label for="icon">Ikona:</label><br />
            <select id="icon" name="icon">
                <option value="/icons/android.png">Android</option>
                <option value="/icons/bell.png">Dzwonek</option>
                <option value="/icons/message.png">Wiadomość</option>
            </select><br /><br />

            <button type="submit">Wyświetl powiadomienie</button>
        </form>
        <p id="form-status" role="status"></p>

    </body>
</html>
